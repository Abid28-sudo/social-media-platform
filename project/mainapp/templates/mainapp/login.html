{% extends 'mainapp/base.html' %}

{% block content %}
<div class="card">
    <h1>Log in</h1>
    <form method="post">
        {% csrf_token %}
        {% if form.non_field_errors %}
        <div class="status">{{ form.non_field_errors }}</div>
        {% endif %}
        {{ form.as_p }}
        {% if next %}
        <input type="hidden" name="next" value="{{ next }}">
        {% endif %}
        <button type="submit">Login</button>
        <p class="status">Don't have an account? <a href="{% url 'signup' %}">Sign up</a></p>
    </form>
</div>
{% endblock %}
