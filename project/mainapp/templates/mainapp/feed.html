{% extends 'mainapp/base.html' %}

{% block content %}
<h2>Feed</h2>
<a class="button" href="{% url 'create_post' %}">+ New Post</a>
{% for post in posts %}
<div class="card">
    <a class="button" href="{% url 'post_detail' post.id %}">View / Comment</a>
    <strong>{{ post.user.username }}</strong>
    <p>{{ post.text }}</p>
    {% if post.image %}
    <img src="{{ post.image.url }}" alt="Post image">
    {% endif %}
    <p class="small-text">{{ post.created_at }}</p>
</div>
{% empty %}
<p>No posts yet.</p>
{% endfor %}
{% endblock %}
