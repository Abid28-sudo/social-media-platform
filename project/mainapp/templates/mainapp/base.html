{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Media</title>
    <link rel="stylesheet" href="{% static 'mainapp/styles.css' %}">
    <script src="{% static 'mainapp/main.js' %}"></script>
</head>

<body>
    <header class="site-header">
        <div class="container">
            <a class="brand" href="{% url 'feed' %}">Social Media</a>
            <nav>
                <a href="{% url 'feed' %}">Feed</a>
                <a href="{% url 'create_post' %}">+ Post</a>
                {% if request.user.is_authenticated %}
                <a href="{% url 'profile' request.user.username %}">Profile</a>
                <a href="{% url 'logout' %}">Logout</a>
                {% else %}
                <a href="{% url 'login' %}">Login</a>
                <a href="{% url 'signup' %}">Signup</a>
                {% endif %}
            </nav>
        </div>
    </header>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 Social Media. All rights reserved.</p>
        </div>
    </footer>
    <div class="page-loader">
        <div class="loader-spinner"></div>
    </div>
</body>

</html>
